<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fishtank</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button id="toggle" type="button">Start</button>

    <p id="session-status" hidden></p>
    <button id="logout" type="button" hidden>Log out</button>
    <button id="classes-button" type="button" hidden>Classes</button>

    <div id="classes" hidden>
      <form id="class-form">
        <label>
          New class name
          <input name="className" type="text" required />
        </label>
        <button type="submit">Create class</button>
        <p id="class-status"></p>
      </form>

      <form id="student-form" hidden>
        <label>
          Class
          <select name="classId"></select>
        </label>
        <div class="list">
          People in this class
          <ul id="roster"></ul>
        </div>
        <div id="add-student">
          <label>
            Add a student by username
            <input name="search" type="search" autocomplete="off" placeholder="Search usernames" />
          </label>
          <ul id="search-results"></ul>
        </div>
        <p id="student-status"></p>
      </form>
    </div>

    <div id="forms">
      <form id="profile-form">
        <label>
          Username
          <input name="username" type="text" required />
        </label>
        <label>
          Email
          <input name="email" type="email" required />
        </label>
        <label>
          Password
          <input name="password" type="password" minlength="6" required />
        </label>
        <button type="submit">Create account</button>
        <p id="profile-status"></p>
      </form>

      <form id="login-form">
        <label>
          Email
          <input name="email" type="email" required />
        </label>
        <label>
          Password
          <input name="password" type="password" required />
        </label>
        <button type="submit">Log in</button>
        <p id="login-status"></p>
      </form>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
